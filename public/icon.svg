<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="passieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2001A"/>
      <stop offset="100%" stop-color="#B30014"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Red Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#passieBg)"/>
  
  <!-- Inner Subtle Border -->
  <rect x="6.5" y="6.5" width="107" height="107" rx="27.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Ticket Body with Notches -->
  <g filter="url(#shadow)">
    <!-- Ticket outline path with left and right circular cutouts -->
    <path d="M 28 42
             C 28 37.58 31.58 34 36 34
             L 84 34
             C 88.42 34 92 37.58 92 42
             L 92 53
             A 7 7 0 0 0 92 67
             L 92 78
             C 92 82.42 88.42 86 84 86
             L 36 86
             C 31.58 86 28 82.42 28 78
             L 28 67
             A 7 7 0 0 0 28 53
             Z"
          fill="#FFFFFF" />

    <!-- Dashed stub separator -->
    <line x1="48" y1="38" x2="48" y2="82" stroke="#E2001A" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round" opacity="0.35"/>

    <!-- Prominent Checkmark -->
    <path d="M 59 60 L 67 68 L 81 52"
          fill="none"
          stroke="#E2001A"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
